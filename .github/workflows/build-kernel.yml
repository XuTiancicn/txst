name: Build Marble Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build marble boot.img (source kernel Image + stock container)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev flex bison bc \
            cpio libssl-dev libelf-dev \
            clang lld llvm \
            kmod device-tree-compiler
          clang --version | head -1
          ld.lld --version | head -1

      - name: Clone LineageOS kernel source (lineage-23.2)
        run: |
          git clone --depth 1 --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8450.git kernel

      - name: Show kernel version
        working-directory: kernel
        run: |
          head -5 Makefile
          ls arch/arm64/configs/ | grep -E 'gki|defconfig' | head

      - name: Generate kernel config (official gki + vendor fragments)
        working-directory: kernel
        run: |
          # 与设备树 android_device_xiaomi_sm8450-common TARGET_KERNEL_CONFIG 一致:
          #   gki_defconfig + vendor/waipio_GKI.config + vendor/xiaomi_GKI.config
          #   + vendor/marble_GKI.config + vendor/debugfs.config
          make ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/kconfig/merge_config.sh \
            .config \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/marble_GKI.config \
            arch/arm64/configs/vendor/debugfs.config 2>&1 | tail -12
          make ARCH=arm64 LLVM=1 olddefconfig
          echo "---- key symbols ----"
          grep -E 'CONFIG_GKI|CONFIG_LOCALVERSION|CONFIG_CC_VERSION|CONFIG_MODULES|CONFIG_ANDROID' .config | head

      - name: Build kernel image (Image, uncompressed)
        working-directory: kernel
        run: |
          # 官方 boot.img 内核段为未压缩 Image（BOARD_KERNEL_IMAGE_NAME := Image）
          # vendor config 全量编译内存峰值高, runner 16GB 会 OOM → 追加 swap 兜底
          # ⚠ runner 自带 swap 文件已占用 /swapfile (fallocate 报 Text file busy),
          #   必须换路径; 同时用 dd 兜底 fallocate 不支持的情况
          free -h
          sudo fallocate -l 8G /mnt/swap8g 2>/dev/null \
            || sudo dd if=/dev/zero of=/mnt/swap8g bs=1M count=8192 status=none
          sudo chmod 600 /mnt/swap8g
          sudo mkswap /mnt/swap8g >/dev/null 2>&1 && sudo swapon /mnt/swap8g \
            || echo "WARN: 追加 swap 失败, 继续尝试编译"
          free -h
          # 日志落盘; 失败时先抓 error 上下文再 tail (make -j 并行输出会把真实错误顶出窗口)
          make ARCH=arm64 LLVM=1 -j$(nproc) Image > build.log 2>&1 \
            || { echo "===== 编译失败: error 上下文 ====="; \
                 grep -n -E "error:|Error [0-9]+|Killed|fatal|undefined reference|No space left" build.log | head -30; \
                 echo "===== 编译失败: 末尾 40 行 ====="; tail -40 build.log; exit 1; }
          tail -8 build.log
          ls -lh arch/arm64/boot/Image

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp kernel/arch/arm64/boot/Image dist/Image
          cp kernel/.config dist/gki_defconfig_used.config
          KV=$(make -C kernel --no-print-directory kernelversion | tail -1)
          echo "KERNEL_VERSION=$KV" >> $GITHUB_ENV
          echo "kernelversion: $KV"
          ls -lh dist/

      - name: Pack boot.img (stock container + new kernel)
        run: |
          # 容器=设备现刷包解包件(stock/header.bin+ramdisk+boot_signature, 来源=官方 LOS boot 分区)
          # 仅替换 kernel 段(未压缩 Image), ramdisk/签名/header 原样保留
          python3 scripts/repack_boot.py \
            dist/Image \
            stock/header.bin \
            stock/ramdisk \
            stock/boot_signature \
            dist/boot.img
          python3 - <<'EOF'
          import struct
          data = open('dist/boot.img','rb').read(4096)
          magic = data[:8]
          assert magic == b'ANDROID!', f"BOOT_MAGIC 错误: {magic}"
          hv   = struct.unpack_from('<I', data, 40)[0]
          osv  = struct.unpack_from('<I', data, 16)[0]
          ksz  = struct.unpack_from('<I', data, 8)[0]
          rsz  = struct.unpack_from('<I', data, 12)[0]
          sigsz = struct.unpack_from('<I', data, 1580)[0]
          print(f"BOOT_MAGIC: ANDROID! OK")
          print(f"header_version: {hv}  (v4 预期)")
          print(f"os_version: 0x{osv:08x}")
          print(f"kernel_size: {ksz} ({ksz/1024/1024:.1f} MB) — 应≈新 Image 未压缩大小")
          print(f"ramdisk_size: {rsz} ({rsz/1024:.0f} KB)")
          print(f"boot_signature_size: {sigsz}")
          assert hv == 4, "header version 不是 4"
          assert ksz > 0, "kernel 为空"
          assert rsz > 0, "ramdisk 为空 (必须带原 ramdisk)"
          assert sigsz == 4096, "boot_signature 缺失"
          print("完整 boot.img 校验通过")
          EOF

      - name: Pack TWRP sideload OTA zip
        run: |
          # boot.img + 自动槽位探测/写入/回读校验 的 update-binary -> TWRP adb sideload 直刷包
          python3 scripts/make_sideload_zip.py \
            dist/boot.img \
            dist/marble-kernel-sideload.zip \
            "$KERNEL_VERSION"
          ls -lh dist/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marble-kernel-lineage23.2
          path: dist/
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Marble Kernel Build #${{ github.run_number }}"
          body: |
            LineageOS 23.2 (Android 16) GKI 内核构建

            - 设备: 红米 Note 12 Turbo (marble) / POCO F5
            - 内核: android12-5.10 (${{ env.KERNEL_VERSION }})
            - 配置: gki_defconfig + waipio/xiaomi/marble/debugfs 厂商片段 merge, LLVM=1
            - 仓库: LineageOS/android_kernel_xiaomi_sm8450 @ lineage-23.2
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}

            **文件说明**
            - `boot.img` — 完整可刷 boot 映像 (GKI v4: 源码编译 Image + 原 ramdisk + 原签名段)
            - `marble-kernel-sideload.zip` — TWRP sideload OTA 包 (TWRP → Advanced → ADB Sideload → adb sideload 该文件, 自动写当前槽 boot 分区)
            - `Image` — 未压缩内核 (源码编译, 官方五段 config)
            - `gki_defconfig_used.config` — 实际生效的内核配置 (已 merge 厂商片段)
          files: |
            dist/boot.img
            dist/marble-kernel-sideload.zip
            dist/Image
            dist/gki_defconfig_used.config
          fail_on_unmatched_files: true
          make_latest: true
