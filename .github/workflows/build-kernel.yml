name: Build Marble Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build android12-5.10 GKI kernel (gki_defconfig)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev flex bison bc \
            cpio libssl-dev libelf-dev \
            clang lld llvm \
            kmod device-tree-compiler
          clang --version | head -1
          ld.lld --version | head -1

      - name: Clone LineageOS kernel source (lineage-23.2)
        run: |
          git clone --depth 1 --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8450.git kernel

      - name: Show kernel version
        working-directory: kernel
        run: |
          head -5 Makefile
          ls arch/arm64/configs/ | grep -E 'gki|defconfig' | head

      - name: Generate gki_defconfig
        working-directory: kernel
        run: |
          make ARCH=arm64 LLVM=1 gki_defconfig
          echo "---- enabled GKI core ----"
          grep -E 'CONFIG_GKI|CONFIG_LOCALVERSION|CONFIG_CC_VERSION' .config | head

      - name: Build kernel image
        working-directory: kernel
        run: |
          make ARCH=arm64 LLVM=1 -j$(nproc) Image.gz 2>&1 | tail -60
          ls -lh arch/arm64/boot/Image.gz arch/arm64/boot/Image

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp kernel/arch/arm64/boot/Image.gz dist/Image.gz
          cp kernel/arch/arm64/boot/Image dist/Image
          cp kernel/.config dist/gki_defconfig_used.config
          KV=$(make -C kernel --no-print-directory kernelversion | tail -1)
          echo "KERNEL_VERSION=$KV" >> $GITHUB_ENV
          echo "kernelversion: $KV"
          cd kernel && make ARCH=arm64 LLVM=1 INSTALL_MOD_PATH=../dist/modules modules_install 2>&1 | tail -5 || true
          cd ..
          tar -czf dist/modules.tar.gz -C dist/modules lib 2>/dev/null || true
          ls -lh dist/

      - name: Pack full boot.img (new kernel + stock ramdisk + stock signature)
        run: |
          # 使用仓库内解包产物（stock/ramdisk + stock/boot_signature，来源=设备现刷包）
          # 重打包为新内核 Image.gz + 原 ramdisk + 原签名段，结构与原镜像完全一致
          python3 scripts/repack_boot.py \
            dist/Image.gz \
            stock/ramdisk \
            stock/boot_signature \
            0x18000199 \
            dist/boot.img
          ls -lh dist/boot.img
          python3 - <<'EOF'
          import struct
          data = open('dist/boot.img','rb').read(4096)
          magic = data[:8]
          assert magic == b'ANDROID!', f"BOOT_MAGIC 错误: {magic}"
          hv   = struct.unpack_from('<I', data, 40)[0]
          osv  = struct.unpack_from('<I', data, 16)[0]
          ksz  = struct.unpack_from('<I', data, 8)[0]
          rsz  = struct.unpack_from('<I', data, 12)[0]
          sigsz = struct.unpack_from('<I', data, 1580)[0]
          print(f"BOOT_MAGIC: ANDROID! OK")
          print(f"header_version: {hv}  (v4 预期)")
          print(f"os_version: 0x{osv:08x}")
          print(f"kernel_size: {ksz} ({ksz/1024/1024:.1f} MB)")
          print(f"ramdisk_size: {rsz} ({rsz/1024:.0f} KB)")
          print(f"boot_signature_size: {sigsz}")
          assert hv == 4, "header version 不是 4"
          assert ksz > 0, "kernel 为空"
          assert rsz > 0, "ramdisk 为空 (必须带原 ramdisk)"
          assert sigsz == 4096, "boot_signature 缺失"
          print("完整 boot.img 校验通过")
          EOF

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marble-kernel-lineage23.2
          path: dist/
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Marble Kernel Build #${{ github.run_number }}"
          body: |
            LineageOS 23.2 (Android 16) GKI 内核构建

            - 设备: 红米 Note 12 Turbo (marble) / POCO F5
            - 内核: android12-5.10 (${{ env.KERNEL_VERSION }})
            - 配置: gki_defconfig, LLVM=1
            - 仓库: LineageOS/android_kernel_xiaomi_sm8450 @ lineage-23.2
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}

            **文件说明**
            - `boot.img` — 完整刷机镜像 (GKI boot header v4, 新内核 + 设备原 ramdisk + 原签名段)
            - `Image.gz` — gzip 压缩内核
            - `Image` — 未压缩内核
            - `gki_defconfig_used.config` — 实际生效的内核配置
          files: |
            dist/boot.img
            dist/Image.gz
            dist/Image
            dist/gki_defconfig_used.config
          fail_on_unmatched_files: true
          make_latest: true
