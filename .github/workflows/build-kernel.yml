name: Build Marble Kernel (AOSP GKI + LOS + Droidian display)

# =============================================================================
# 三个内核 job, 编译核心共用 scripts/compile_kernel.sh (swap 兜底/KCFLAGS/失败诊断):
#   ① gki-aosp           ★推送即跑★ Google AOSP kernel/common 的 GKI 内核,
#                        用原厂 OS2.0.5.0.VMRCNXM 的 boot 容器重打包
#   ② lineage-gki        LineageOS 23.2 GKI 内核            (手动勾选)
#   ③ droidian-display   Droidian + DRM_MSM 显示驱动内核     (手动勾选)
#
# ②③ 由「推送即跑」改为「手动勾选」的原因:
#   - 内核来源已按要求切到 Google AOSP(见 ①), ②③ 不再走主流程;
#   - 两者各要 90~120 分钟, 不该每次 push 都烧; 需要用旧线时在 Actions
#     页面 Run workflow 里勾上对应开关即可, 代码路径完全保留。
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      build_gki:
        description: '① AOSP GKI 内核 (kernel/common + 原厂容器重打包)'
        type: boolean
        default: true
      build_los:
        description: '② LineageOS 23.2 GKI 内核 (旧线, 90 分钟)'
        type: boolean
        default: false
      build_droidian_display:
        description: '③ Droidian + DRM_MSM 显示内核 (旧线, 120 分钟)'
        type: boolean
        default: false
      kernel_branch:
        description: '③ 的内核分支'
        required: false
        default: 'droidian'
      aosp_clang:
        description: '① 用官方预编译 clang r416183b (填 0 改用系统 clang, 仅调试)'
        type: string
        default: '1'
      gki_ref:
        description: '① AOSP kernel/common 的 tag/分支'
        type: string
        default: 'android12-5.10.209_r00'
  push:
    branches: [main, master]
    # 只在改到内核构建链相关文件时触发 (以前是任何 push 都会跑满 90+120 分钟)
    paths:
      - 'scripts/build_gki_aosp.sh'
      - 'scripts/compile_kernel.sh'
      - 'scripts/repack_boot.py'
      - 'scripts/unpack_boot_v4.py'
      - 'scripts/make_sideload_zip.py'
      - 'custom/kernel/gki-aosp.fragment'
      - 'stock-os2050/**'
      - '.github/workflows/build-kernel.yml'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # ① LineageOS 23.2 GKI 内核 (push/手动 都跑)
  #    源码: LineageOS/android_kernel_xiaomi_sm8450 @ lineage-23.2
  #    容器: 仓库内 stock/ (官方 LOS boot 分区解包件)
  # ---------------------------------------------------------------------------
  lineage-gki:
    name: LineageOS 23.2 GKI kernel
    runs-on: ubuntu-24.04
    # 手动勾选才跑 (改由 AOSP GKI job 承担主线, 见文件头说明)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_los }}
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev flex bison bc \
            cpio libssl-dev libelf-dev \
            clang lld llvm \
            kmod device-tree-compiler
          clang --version | head -1
          ld.lld --version | head -1

      - name: Clone LineageOS kernel source (lineage-23.2)
        run: |
          git clone --depth 1 --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8450.git kernel

      - name: Show kernel version
        working-directory: kernel
        run: |
          head -5 Makefile
          ls arch/arm64/configs/ | grep -E 'gki|defconfig' | head

      - name: Generate kernel config (official gki + vendor fragments)
        working-directory: kernel
        run: |
          # 与设备树 android_device_xiaomi_sm8450-common TARGET_KERNEL_CONFIG 一致:
          #   gki_defconfig + vendor/waipio_GKI.config + vendor/xiaomi_GKI.config
          #   + vendor/marble_GKI.config + vendor/debugfs.config
          make ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/kconfig/merge_config.sh \
            .config \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/marble_GKI.config \
            arch/arm64/configs/vendor/debugfs.config 2>&1 | tail -12
          make ARCH=arm64 LLVM=1 olddefconfig
          echo "---- key symbols ----"
          grep -E 'CONFIG_GKI|CONFIG_LOCALVERSION|CONFIG_CC_VERSION|CONFIG_MODULES|CONFIG_ANDROID' .config | head

      - name: Build kernel image (Image, uncompressed)
        working-directory: kernel
        run: |
          # 编译核心共用 scripts/compile_kernel.sh (与 droidian-display job 同一脚本):
          #   ① swap 兜底: runner 自带 swap 占 /swapfile, 必须换 /mnt/swap8g + dd 兜底
          #   ② KCFLAGS=-Wno-frame-larger-than: Ubuntu clang18 编 5.10 io_issue_sqe
          #      栈帧 2560B>CONFIG_FRAME_WARN=2048 报 -Werror (官方 prebuilt clang 不触发)
          #   ③ 失败诊断: 先 grep error 上下文再 tail (make -j 并行会淹没真实错误)
          bash ../scripts/compile_kernel.sh . Image

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp kernel/arch/arm64/boot/Image dist/Image
          cp kernel/.config dist/gki_defconfig_used.config
          KV=$(make -C kernel --no-print-directory kernelversion | tail -1)
          echo "KERNEL_VERSION=$KV" >> $GITHUB_ENV
          echo "kernelversion: $KV"
          ls -lh dist/

      - name: Pack boot.img (stock container + new kernel)
        run: |
          # 容器=设备现刷包解包件(stock/header.bin+ramdisk+boot_signature, 来源=官方 LOS boot 分区)
          # 仅替换 kernel 段(未压缩 Image), ramdisk/签名/header 原样保留
          python3 scripts/repack_boot.py \
            dist/Image \
            stock/header.bin \
            stock/ramdisk \
            stock/boot_signature \
            dist/boot.img
          python3 - <<'EOF'
          import struct
          data = open('dist/boot.img','rb').read(4096)
          magic = data[:8]
          assert magic == b'ANDROID!', f"BOOT_MAGIC 错误: {magic}"
          hv   = struct.unpack_from('<I', data, 40)[0]
          osv  = struct.unpack_from('<I', data, 16)[0]
          ksz  = struct.unpack_from('<I', data, 8)[0]
          rsz  = struct.unpack_from('<I', data, 12)[0]
          sigsz = struct.unpack_from('<I', data, 1580)[0]
          print(f"BOOT_MAGIC: ANDROID! OK")
          print(f"header_version: {hv}  (v4 预期)")
          print(f"os_version: 0x{osv:08x}")
          print(f"kernel_size: {ksz} ({ksz/1024/1024:.1f} MB) — 应≈新 Image 未压缩大小")
          print(f"ramdisk_size: {rsz} ({rsz/1024:.0f} KB)")
          print(f"boot_signature_size: {sigsz}")
          assert hv == 4, "header version 不是 4"
          assert ksz > 0, "kernel 为空"
          assert rsz > 0, "ramdisk 为空 (必须带原 ramdisk)"
          assert sigsz == 4096, "boot_signature 缺失"
          print("完整 boot.img 校验通过")
          EOF

      - name: Pack TWRP sideload OTA zip
        run: |
          # boot.img + 自动槽位探测/写入/回读校验 的 update-binary -> TWRP adb sideload 直刷包
          python3 scripts/make_sideload_zip.py \
            dist/boot.img \
            dist/marble-kernel-sideload.zip \
            "$KERNEL_VERSION"
          ls -lh dist/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marble-kernel-lineage23.2
          path: dist/
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Marble Kernel Build #${{ github.run_number }}"
          body: |
            LineageOS 23.2 (Android 16) GKI 内核构建

            - 设备: 红米 Note 12 Turbo (marble) / POCO F5
            - 内核: android12-5.10 (${{ env.KERNEL_VERSION }})
            - 配置: gki_defconfig + waipio/xiaomi/marble/debugfs 厂商片段 merge, LLVM=1
            - 仓库: LineageOS/android_kernel_xiaomi_sm8450 @ lineage-23.2
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}

            **文件说明**
            - `boot.img` — 完整可刷 boot 映像 (GKI v4: 源码编译 Image + 原 ramdisk + 原签名段)
            - `marble-kernel-sideload.zip` — TWRP sideload OTA 包 (TWRP → Advanced → ADB Sideload → adb sideload 该文件, 自动写当前槽 boot 分区)
            - `Image` — 未压缩内核 (源码编译, 官方五段 config)
            - `gki_defconfig_used.config` — 实际生效的内核配置 (已 merge 厂商片段)
          files: |
            dist/boot.img
            dist/marble-kernel-sideload.zip
            dist/Image
            dist/gki_defconfig_used.config
          fail_on_unmatched_files: true
          make_latest: true

  # ---------------------------------------------------------------------------
  # ② Droidian display 内核 (push/手动 都跑, 手动可换 kernel_branch)
  #    源码: droidian-marble/linux-droidian-marble @ droidian (自带 techpack/display)
  #    做法: Kconfig 补丁接入 display 符号 -> marble_defconfig 开 DRM_MSM 系列 built-in
  #          -> compile_kernel.sh 编译 -> 官方 5.10.238 boot.img 容器重打包
  # ---------------------------------------------------------------------------
  droidian-display:
    name: Droidian 5.10.238 + DRM_MSM display kernel
    runs-on: ubuntu-24.04
    # 手动勾选才跑 (改由 AOSP GKI job 承担主线, 见文件头说明)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_droidian_display }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android 2>/dev/null || true
          df -h / | tail -1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm cpio lz4 flex bison bc \
            libssl-dev libelf-dev kmod device-tree-compiler 2>&1 | tail -2
          clang --version | head -1

      - name: Build display kernel (Kconfig patch + DRM_MSM built-in)
        env:
          # push 触发无 inputs -> 回落默认 droidian
          KERNEL_BRANCH: ${{ inputs.kernel_branch || 'droidian' }}
        run: |
          chmod +x scripts/build_display_kernel.sh
          ./scripts/build_display_kernel.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marble-display-kernel
          path: |
            dist/boot.img
            dist/Image
          if-no-files-found: error
          retention-days: 14

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: display-kernel-${{ github.run_number }}
          name: Droidian marble display kernel (DRM_MSM built-in)
          body: |
            带显示驱动的 Droidian marble 内核 boot.img (techpack/display built-in, 非模块)

            **用途**: 修复官方内核线 (gki/非gki/Melt) 均无 msm_drm 导致的黑屏

            **文件说明**
            - `boot.img` — 完整可刷 boot 映像 (5.10.238 原 ramdisk + 显示驱动内置内核)
            - `Image` — 未压缩内核 (含 DRM_MSM)

            **刷入**: fastboot flash boot_a boot.img && fastboot flash boot_b boot.img
            (或进 TWRP adb sideload 桌面的 sideload zip)
          files: |
            dist/boot.img
            dist/Image
          fail_on_unmatched_files: true
          make_latest: false

  # ---------------------------------------------------------------------------
  # ① AOSP GKI 内核 —— Google 官方 kernel/common, 推送即跑
  #
  #   源码  : aosp-mirror/kernel_common @ android12-5.10.209_r00
  #           (= 原厂内核基线 v5.10.209, GKI KMI 代号 android12-9)
  #   容器  : 仓库内 stock-os2050/ (原厂 OS2.0.5.0.VMRCNXM 的 boot 段)
  #   工具链: clang r416183b (clang 12.0.5) —— 与原厂 banner 完全一致。
  #           原厂内核实测带旧式 CFI(__cfi_ / .cfi_jt / cfi_check, 无 kcfi),
  #           且 gki_defconfig 是 CONFIG_CFI_CLANG=y + LTO_CLANG_FULL=y,
  #           系统 clang 18 编不动(旧式 -fsanitize=cfi / -flto=full 已变),
  #           所以必须用官方预编译 clang。
  #   产物  : boot.img / Image / System.map / 生效 config / sideload OTA zip
  #   失败  : 完整日志发到 Release tag debug-gki-<run_number>(公开可下, 零凭据)
  # ---------------------------------------------------------------------------
  gki-aosp:
    name: AOSP GKI kernel (kernel/common android12-5.10)
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_gki) }}
    timeout-minutes: 240

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: 腾磁盘 (内核源码 ~1.5G + 官方 clang ~1.5G + FULL-LTO 产物)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # 保留 runner 自带 swap: compile_kernel.sh 还会再挂 8G(/mnt/swap8g),
          # FULL-LTO 链接阶段吃内存, 两个 swap 叠加更稳
          swap-storage: false

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev \
            cpio kmod zstd lz4 xz-utils device-tree-compiler \
            python3 python3-yaml git
          df -h / | tail -1

      - name: 编 AOSP GKI 内核 + 用原厂容器重打包
        env:
          USE_AOSP_CLANG: ${{ github.event_name == 'workflow_dispatch' && inputs.aosp_clang || '1' }}
          GKI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.gki_ref || 'android12-5.10.209_r00' }}
        run: |
          set -o pipefail
          chmod +x scripts/build_gki_aosp.sh scripts/compile_kernel.sh
          echo "USE_AOSP_CLANG=$USE_AOSP_CLANG"
          echo "GKI_REF=$GKI_REF"
          set +e
          bash scripts/build_gki_aosp.sh > gki-build.log 2>&1
          rc=$?
          set -e
          echo "===== build rc=$rc ====="
          grep -nE '^I: |^W: |^E: ' gki-build.log | tail -70 || true
          if [ "$rc" -ne 0 ]; then
            echo "===== 关键错误行 ====="
            grep -nE "error:|Error [0-9]+|Killed|fatal|No space left|undefined reference|E: " gki-build.log | head -40 || true
            echo "===== 末尾 60 行 ====="
            tail -60 gki-build.log
            echo "::error::AOSP GKI 内核构建失败 rc=$rc —— 完整日志见 Release tag debug-gki-${{ github.run_number }}"
          fi
          exit "$rc"

      - name: 产物摘要
        if: success()
        run: |
          ls -lh dist/
          echo "---------------- gki-info.txt ----------------"
          cat dist/gki-info.txt

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marble-gki-aosp
          path: |
            dist/boot.img
            dist/gki-marble-sideload.zip
            dist/Image
            dist/System.map
            dist/gki-aosp-used.config
            dist/gki-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gki-${{ github.run_number }}
          name: "Marble AOSP GKI kernel #${{ github.run_number }}"
          body: |
            用 **Google AOSP 官方内核源码**为 marble 编的 GKI 内核。

            - 设备: 红米 Note 12 Turbo / POCO F5 (marble, SM7475)
            - 源码: `aosp-mirror/kernel_common @ android12-5.10.209_r00`
              (= 原厂 HyperOS OS2.0.5.0.VMRCNXM 内核基线 v5.10.209, KMI 代号 android12-9)
            - 工具链: 官方预编译 clang r416183b (clang 12.0.5, 与原厂 banner 一致)
            - boot 容器: 原厂 `OS2.0.5.0.VMRCNXM/images/boot.img` 的 header+ramdisk+signature
              (仅替换内核段, 内核段为 raw 未压缩 arm64 Image —— marble ABL 不认 gzip 段)
            - 提交: `${{ github.sha }}`

            **文件说明**
            - `boot.img` — 完整可刷 GKI 映像 (`fastboot flash boot_ab boot.img`)
            - `gki-marble-sideload.zip` — TWRP adb sideload 包 (自动判 A/B 槽 + 回读校验)
            - `Image` — 未压缩 arm64 内核
            - `gki-aosp-used.config` — 实际生效的内核配置
            - `gki-info.txt` — 构建溯源 (源码 sha / UTS_RELEASE / 容器 sha256 / 工具链)

            **注意**: 本内核源码为**纯 AOSP GKI**, 不含任何 Xiaomi/Qualcomm 专有代码;
            硬件驱动与设备树由原厂 `vendor_boot`/`vendor_dlkm`/`dtbo` 提供, 均未改动。
          files: |
            dist/boot.img
            dist/gki-marble-sideload.zip
            dist/Image
            dist/gki-aosp-used.config
            dist/gki-info.txt
          fail_on_unmatched_files: false
          make_latest: false

      - name: 失败 -> 完整日志发到 Release (公开可下, 零凭据)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-gki-${{ github.run_number }}
          name: "[debug] AOSP GKI 构建日志 #${{ github.run_number }}"
          body: |
            失败运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            本仓库取不了 Actions 日志正文(REST API 需 token), 故把全量日志发成 Release 产物,
            `releases/download/...` 免凭据即可下载。
          make_latest: false
          fail_on_unmatched_files: false
          files: gki-build.log
