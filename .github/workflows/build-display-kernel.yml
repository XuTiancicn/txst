name: Build Droidian marble display kernel

# 手动触发 (每次 Run 克隆最新 droidian 分支源码编译, 产出带显示驱动的 boot.img)
on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支 (默认 droidian)'
        required: false
        default: 'droidian'

jobs:
  build:
    name: Build display kernel (5.10.238 + DRM_MSM built-in)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android 2>/dev/null || true
          df -h / | tail -1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm cpio lz4 flex bison bc \
            libssl-dev libelf-dev kmod device-tree-compiler 2>&1 | tail -2
          clang --version | head -1

      - name: Build display kernel
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          chmod +x scripts/build_display_kernel.sh
          ./scripts/build_display_kernel.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marble-display-kernel
          path: |
            dist/boot.img
            dist/Image
          if-no-files-found: error
          retention-days: 14

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: display-kernel-${{ github.run_number }}
          name: Droidian marble display kernel (DRM_MSM built-in)
          body: |
            带显示驱动的 Droidian marble 内核 boot.img (techpack/display built-in, 非模块)

            **用途**: 修复官方内核线 (gki/非gki/Melt) 均无 msm_drm 导致的黑屏

            **文件说明**
            - `boot.img` — 完整可刷 boot 映像 (5.10.238 原 ramdisk + 显示驱动内置内核)
            - `Image` — 未压缩内核 (含 DRM_MSM)

            **刷入**: fastboot flash boot_a boot.img && fastboot flash boot_b boot.img
            (或进 TWRP adb sideload 桌面的 sideload zip)
          files: |
            dist/boot.img
            dist/Image
          fail_on_unmatched_files: true
          make_latest: false
